{% extends "base.html" %}

{% block title %}Завершение регистрации{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="custom-card p-4 p-md-5">
            <h2 class="fw-bold mb-3" style="color: var(--primary-navy);">Почти готово!</h2>
            <p class="text-muted mb-4">Пожалуйста, укажите ваше настоящее имя и класс, чтобы другие ученики могли вас узнать.</p>

            <form method="post" action="/profile/setup">
                <div class="mb-3">
                    <label for="last_name" class="form-label">Фамилия</label>
                    <input type="text" class="form-control" id="last_name" name="last_name" required>
                </div>
                <div class="mb-3">
                    <label for="first_name" class="form-label">Имя</label>
                    <input type="text" class="form-control" id="first_name" name="first_name" required>
                </div>
                <div class="mb-4">
                    <label for="class_name" class="form-label">Класс</label>
                    <input type="text" class="form-control" id="class_name" name="class_name" placeholder="Например, 10А" value="{{ user.class_name or '' }}">
                </div>
                <button type="submit" class="btn btn-accent w-100">Сохранить и продолжить</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
